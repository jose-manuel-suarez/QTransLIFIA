[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtranslifia"
version = "0.2.0"
description = "Traducción de circuitos Quirk a OpenQASM y migración a Qiskit, AWS Braket y PennyLane."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LIFIA author", email="jsuarez@lifia.info.unlp.edu.ar" }]
keywords = ["quantum", "quirk", "openqasm", "qiskit", "braket", "pennylane", "zx-calculus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pyzx>=0.10.7",
    "qiskit",
    "qiskit-qasm3-import",
    "matplotlib",
    "pylatexenc",
    "pandas",
    "selenium",
]

[project.optional-dependencies]
http = [
    "Flask==2.0.1",
    "Flask-Cors==3.0.10",
    "Werkzeug==2.3.4",
]
providers = [
    "amazon-braket-sdk",
    "pennylane",
]
notebook = [
    "jupyter",
    "ipykernel",
    "qiskit-aer",
]
dev = [
    "qiskit-aer",
]

[project.scripts]
qtrans = "qtrans:main"

[tool.setuptools.packages.find]
include = ["qtrans*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"qtrans.utils" = ["*.py"]

[project.urls]
Homepage = "https://github.com/jose-manuel-suarez/QTransLIFIA"
Issues = "https://github.com/jose-manuel-suarez/QTransLIFIA/issues"