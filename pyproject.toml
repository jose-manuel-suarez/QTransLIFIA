[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qtranslifia"
version = "0.1.0"
description = "Traducción de circuitos Quirk a OpenQASM y migración a Qiskit, AWS Braket y PennyLane."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "QTransLIFIA" }]
keywords = ["quantum", "quirk", "openqasm", "qiskit", "braket", "pennylane", "zx-calculus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pyzx>=0.10.7",
    "qiskit",
    "qiskit-qasm3-import",
    "matplotlib",
    "pylatexenc",
    "pandas",
    "selenium",
]

[project.optional-dependencies]
http = [
    "Flask==2.0.1",
    "Flask-Cors==3.0.10",
    "Werkzeug==2.3.4",
]
providers = [
    "amazon-braket-sdk",
    "pennylane",
]
notebook = [
    "jupyter",
    "ipykernel",
    "qiskit-aer",
]
dev = [
    "qiskit-aer",
]

[project.scripts]
qtrans = "qtrans:main"

[tool.setuptools]
py-modules = ["qtrans", "translator"]
packages = ["utils"]
include-package-data = true

[tool.setuptools.package-data]
utils = ["*.py"]
